spring.application.name=recommendation.service

# Подключение к H2 в памяти. данные живут только пока запущено приложение. чтобы данные сохранялись на диск, заменить на точный адрес будущего сохранения вроде jdbc:h2:file:./data/bankdb
#jdbc:h2:mem:bankdb — создает базу данных bankdb в оперативке при кждом перезапуске приложения.   mem: in-memory (в оперативной памяти) bankdb- просто имя для БД
spring.datasource.url=jdbc:h2:mem:bankdb

# явное указание класса драйвера
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=
spring.datasource.password=

# URL для базы данных рекомендаций (H2)
application.recommendations-db.url=jdbc:h2:file:./transaction

# вкл веб-консоль H2 для просмотра данных и отладки SQL
spring.h2.console.enabled=true
# просмотр таблицы на http://localhost:8080/h2-console
spring.h2.console.path=/h2-console

# JDBC URL должен совпадать с jdbc:h2:mem:bankdb
