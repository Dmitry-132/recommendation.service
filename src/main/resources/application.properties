spring.application.name=recommendation.service

# === \(-_-)/ ===
spring.config.import=optional:file:.env.properties

# === Telegram-бот ===
telegram.bot.username=reminder132_bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# вкл/выкл Telegram-бота (true/false)
telegram.bot.enabled=true

# === динамические правила рекомендаций (PostgreSQL) ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === БД для рекомендаций (H2)  ===
application.recommendations-db.url=jdbc:h2:file:./transaction

# === веб-консоль H2 ===
spring.h2.console.enabled=true
# просмотр таблицы на http://localhost:8080/h2-console
spring.h2.console.path=/h2-console

# === LIQUIBASE ===
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:liquibase/changelog-master.yml

# === кеш ===
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=30m,recordStats

# === доступ к эндпоинтам для проверки кеша  ===  нужно для actuator. использовать только на разработке
management.endpoints.web.exposure.include=health,info,metrics,caches

# логирование для JdbcTemplate (Spring JDBC) проверка кеша
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

# явное указание кеша
spring.cache.cache-names=getSumByProductTypeAndTransactionTypeCache,getCountTransactionsByTypeCache,hasTransactionsOfTypeCache

# http://localhost:8080/actuator/caches проверить кеш ( DELETE-запрос для сброса)
# http://localhost:8080/actuator/metrics/cache.gets метрика запросов к кешу
# http://localhost:8080/actuator/metrics/cache.gets?tag=result:hit только успешные